# Offline Studio demo: the simple average (every agent weighted equally) over the
# license-free synthetic agent basis in examples/studio_demo/basis, for comparison
# with studio_demo_fit_lasso.yaml. No backend, no network.
run:
  name: studio_demo_fit_simple_average
  run_id: studio-demo-fit-simple-average-r0001
  repeat: 1
  seed: 101
  conditions:
    dataset: studio_demo

data:
  survey:
    source: ../../examples/studio_demo/survey.csv
    schema: ../../examples/studio_demo/survey.yaml
  target: ../../examples/studio_demo/targets.json
  basis: ../../examples/studio_demo/basis

model:
  method: simple_average

split:
  train_val:
    - train
    - valid
  test: test
  use_proxy_only: true

metrics:
  - mse
  - distribution_mse
  - one_minus_jsd
  - emd
  - mcpa

evaluation:
  mse_prediction_policy: raw
  distribution_prediction_policy: clip_and_normalize
  invalid_distribution: error
