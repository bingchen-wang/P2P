# Offline Studio demo: fit Stage 2 (constrained lasso) to the license-free
# synthetic agent basis in examples/studio_demo/basis. No backend, no network.
run:
  name: studio_demo_fit_lasso
  run_id: studio-demo-fit-lasso-r0001
  repeat: 1
  seed: 101
  conditions:
    dataset: studio_demo
    configuration: mass_penalty

data:
  survey:
    source: ../../examples/studio_demo/survey.csv
    schema: ../../examples/studio_demo/survey.yaml
  target: ../../examples/studio_demo/targets.json
  basis: ../../examples/studio_demo/basis

model:
  method: lasso
  alpha:
    logspace: [-5, 5, 30]
  validation:
    strategy: cv
    cv_folds: 5

split:
  train_val:
    - train
    - valid
  test: test
  use_proxy_only: true

metrics:
  - mse
  - distribution_mse
  - one_minus_jsd
  - emd
  - mcpa

evaluation:
  mse_prediction_policy: raw
  distribution_prediction_policy: clip_and_normalize
  invalid_distribution: error
