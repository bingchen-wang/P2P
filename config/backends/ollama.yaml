# Local Ollama profile: no API key, no provider cost. Requires a running Ollama
# server (https://ollama.com) with the model pulled: ollama pull gemma3:4b
response:
  type: ollama
  model_name: gemma3:4b
  formality: >-
    Select one listed option. Return only its option label or numeric code,
    with no explanation.
  kwargs:
    base_url: http://127.0.0.1:11434
    temperature: 0
    max_tokens: 64
    timeout: 120
    think: false
    keep_alive: 5m

endowment:
  type: ollama
  model_name: gemma3:4b
  kwargs:
    base_url: http://127.0.0.1:11434
    temperature: 0.7
    max_tokens: 1024
    timeout: 120
    think: false
    keep_alive: 5m

attribute_learner:
  type: ollama
  model_name: gemma3:4b
  kwargs:
    base_url: http://127.0.0.1:11434
    temperature: 0
    max_tokens: 256
    timeout: 120
    think: false
    keep_alive: 5m
