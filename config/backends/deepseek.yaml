# DeepSeek V4 profile. Authentication is read from DEEPSEEK_API_KEY.
# Thinking is explicit so provider defaults cannot silently change a run.
response:
  type: deepseek
  model_name: deepseek-v4-flash
  formality: >-
    Select one listed option. Return only its option label or numeric code,
    with no explanation.
  kwargs:
    thinking: disabled
    temperature: 0
    max_tokens: 128

endowment:
  type: deepseek
  model_name: deepseek-v4-flash
  kwargs:
    thinking: disabled
    temperature: 0.9
    max_tokens: 1024

attribute_learner:
  type: deepseek
  model_name: deepseek-v4-flash
  kwargs:
    thinking: disabled
    temperature: 0
    max_tokens: 1024
