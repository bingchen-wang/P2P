[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "prompts-to-proxies"
version = "0.1.0"
description = "Emulating human preferences through a compact ensemble of LLM proxies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Bingchen Wang" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "osqp==1.0.4",
    "cvxpy>=1.7,<2",
    "joblib>=1.5,<2",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "plotly>=6.2,<7",
    "prince>=0.16,<1",
    "PyYAML>=6.0,<7",
    "rapidfuzz>=3.13,<4",
    "scikit-learn>=1.7,<2",
    "scipy>=1.14,<2",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14,<1",
    "tqdm>=4.67,<5",
]


[project.optional-dependencies]
openai = [
    "openai>=1.98,<2",
]
gemini = [
    "google-genai>=1.38,<2",
]
dev = [
    "pytest>=8.4,<9",
]
docs = [
    "sphinx>=8.2,<9",
    "sphinx-rtd-theme>=3,<4",
]


[project.scripts]
p2p = "p2p.cli:main"


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = ["."]
include = ["p2p", "p2p.*"]
namespaces = false


[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers -m \"not paid\""
xfail_strict = true
markers = [
    "paid: tests that call metered external APIs",
    "parity: numerical comparisons against legacy golden results",
    "integration: offline tests spanning multiple P2P components",
]