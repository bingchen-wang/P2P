metadata:
  name: legacy_pipeline
  description: Legacy active-pipeline fixture
  version: v1
  seed: 101

paths:
  survey_csv: data/survey.csv
  survey_yaml: data/survey_schema.yaml
  attribute_bank: data/attribute_bank.yaml
  aggregate_json: data/target.json

agent:
  type: dummy
  model_name: dummy
  formality: Return only the selected answer.
  kwargs: {}

endowment_model:
  backend_type: dummy
  model_name: dummy
  temperature: 0
  batch_size: 2
  delay: 0
  retry_failed: false
  max_attributes: 4
  randomize_attributes: false

attribute_learner:
  backend_type: dummy
  model_name: dummy
  max_tokens: 32

generation:
  target_n: 10
  initial_n: 2
  num_update_steps: 1
  parallel: false
  max_workers: 1
  verbose: false

lasso:
  alpha_expr: "np.logspace(-5, 1, 20)"
  max_iter: 10000
  validation:
    strategy: cv
    cv_folds: 5
  post_selection_refit: false

elasticnet:
  alpha_expr: "np.logspace(-5, 1, 20)"
  l1_ratio_expr: "np.linspace(0.1, 1, 10)"
  max_iter: 10000
  validation:
    strategy: cv
    cv_folds: 5
  post_selection_refit: false

split_settings:
  use_proxy_only: true
  train_val_split:
    - train
    - valid
  test_split: test

weight_assignment_model: elasticnet